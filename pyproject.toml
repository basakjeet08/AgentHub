[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenthub"
version = "2.2.0"
description = "A TUI hub for managing coding-agent sessions"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "bittty==0.1.4",
    "textual==8.2.8",
    "textual-tty==0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "textual-dev",
]

[project.scripts]
agenthub = "agenthub.main:main"

[tool.hatch.build]
# VCS ignore files are not consulted: file selection is fully explicit
# via packages below, and a bare `src` rule in global gitignore otherwise
# excludes the entire source tree from builds.
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["src/agenthub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
cache_dir = ".cache/pytest"

[tool.ruff]
target-version = "py313"
line-length = 100
cache-dir = ".cache/ruff"
