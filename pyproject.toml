[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenthub"
version = "0.1.1"
description = "A TUI hub for managing coding-agent sessions"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "textual",
    "textual-tty",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "textual-dev",
]

[project.scripts]
agenthub = "agenthub.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agenthub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
cache_dir = ".cache/pytest"

[tool.ruff]
target-version = "py313"
line-length = 100
cache-dir = ".cache/ruff"

[tool.ruff.lint.per-file-ignores]
# Package __init__ files group exports by concept, not sort order.
"src/agenthub/terminal/__init__.py" = ["RUF022"]
